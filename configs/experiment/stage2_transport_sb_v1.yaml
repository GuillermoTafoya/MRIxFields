seed: 13
# Etapa-2 latent transport, ablation rung 3 (PRIMARY): entropic-OT Schrodinger bridge.
# Same shared v_theta(z_t, t, c_s, c_t) network as OT-CFM — only the coupling and the
# conditional path differ. Simulation-free bridge matching: a Brownian bridge with
# volatility sigma between OT-coupled endpoints, regressing to the bridge drift
# (z1 - z_t)/(1 - t). The VAE is frozen; training runs on the precomputed latent bank.
model:
  name: flow_matching_latent
  latent_channels: 4
  hidden_channels: [64, 128]
  bottleneck_channels: 256
  cond_dim: 128
  time_embed_dim: 128
  time_scale: 1000.0
  spatial_dims: 3
  activation: silu
  skip_mode: concat
training:
  steps: 20000
  batch_size: 8
  lr: 0.0002
  device: auto
  precision: bf16
  coupling: ot          # OT-coupled endpoints (entropic Sinkhorn coupling is a follow-up)
  bridge: schrodinger   # Brownian bridge, target drift (z1 - z_t)/(1 - t)
  sigma: 0.1            # bridge volatility
  time_eps: 0.001
  loss_weights:
    flow: 1.0
    transport_cost: 0.0
    identity: 0.0
    cycle: 0.0
  checkpoint_dir: outputs/stage2_transport_sb_v1/checkpoints
  checkpoint_every_steps: 2000
  checkpoint_at_end: true
  checkpoint_max_bytes: 500000000
  val_every_steps: 1000
  val_batches: 8
  log_every_steps: 50
  resume_from: null
  variant: sb_brownian
